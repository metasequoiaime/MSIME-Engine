name: Build dictionaries

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built dictionaries as a release
        required: false
        type: boolean
        default: false
      tag:
        description: Release tag to publish under, for example dict-2026.09.05
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dictionaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Runs before the 30-minute build so a moved source file fails in seconds rather than at the end.
      - name: Verify the notice still points at real files
        run: python3 tools/verify_notice_paths.py

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build every dictionary
        run: python build_profile.py --profile desktop --fetch-references

      - name: Verify the built artifacts
        run: |
          python build_profile.py --profile desktop --verify
          python3 -m unittest discover -s tests -p 'test_*.py'
          python build_profile.py --profile mobile --source out/desktop/msime.db
          python build_profile.py --profile mobile --verify

      - name: Build the pinned Engine consumer
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-dev libfmt-dev libspdlog-dev libsqlite3-dev
          cmake -S tests/consumer -B out/consumer-build -DCMAKE_BUILD_TYPE=Release
          cmake --build out/consumer-build --parallel 4
      - name: Query, create phrases and replay against both produced profiles
        run: |
          out/consumer-build/dictionary_consumer "$PWD/out/desktop" desktop
          out/consumer-build/dictionary_consumer "$PWD/out/mobile" mobile
      - name: Summarize
        run: |
          {
            echo '### Dictionary artifacts'
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for artifact in msime.db english.db others.db dict_japanese.dat mozc_dictionary_oss_README.txt; do
              printf '| %s | %s |\n' "$artifact" "$(du -h "out/desktop/$artifact" | cut -f1)"
            done
            echo
            echo '```'
            cat out/desktop/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dictionaries
          path: |
            out/desktop/msime.db
            out/desktop/english.db
            out/desktop/others.db
            out/desktop/dict_japanese.dat
            out/desktop/mozc_dictionary_oss_README.txt
            out/desktop/SHA256SUMS.txt
            out/desktop/dictionary-manifest.json
          retention-days: 7
          compression-level: 9

      - name: Upload compact mobile product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dictionaries-mobile
          path: out/mobile/
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate the requested tag
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^dict-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Tag must look like dict-YYYY.MM.DD or dict-YYYY.MM.DD.N, got '$TAG_NAME'." >&2
            exit 1
          fi

      - name: Download the built dictionaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dictionaries
          path: out/desktop

      - name: Verify the downloaded checksums
        working-directory: out/desktop
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes="Dictionary artifacts built from \`$SOURCE_SHA\` by the Build dictionaries workflow.

          Consumed by the Windows installer release workflow in \`metasequoiaime/MSIME-Windows\`.

          \`\`\`
          $(cat out/desktop/SHA256SUMS.txt)
          \`\`\`"
          gh release create "$TAG_NAME" \
            --repo "$GH_REPO" \
            --target "$SOURCE_SHA" \
            --title "Dictionaries $TAG_NAME" \
            --notes "$notes" \
            out/desktop/msime.db out/desktop/english.db out/desktop/others.db out/desktop/dict_japanese.dat \
            out/desktop/mozc_dictionary_oss_README.txt out/desktop/SHA256SUMS.txt out/desktop/dictionary-manifest.json
