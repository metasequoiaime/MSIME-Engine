name: Branch guard

# main is the default and release branch. All pull requests target main.
#
# This is a check rather than a ruleset rule because GitHub rulesets can protect a base branch but
# cannot say which head branches may target it. Add it to main's required status checks so a pull
# request opened against the wrong base cannot be merged.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  base:
    name: Base branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the pull request targets main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "$HEAD_REF targets main."
